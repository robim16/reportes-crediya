server:
  port: 8083
spring:
  application:
    name: "reportes-crediya"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
entrypoint:
  sqs:
    region: "us-east-1"
    #endpoint: "http://localhost:4566"
    queueUrl: "https://sqs.us-east-1.amazonaws.com/276824024432/solicitud-aprobada-queue"
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 10
    numberOfThreads: 1
aws:
  access-key-id: "${AWS_ACCESS_KEY_ID:AWS_ACCESS_KEY_ID}"
  secret-access-key: "${AWS_SECRET_ACCESS_KEY:AWS_SECRET_ACCESS_KEY}"
  region: "${AWS_DEFAULT_REGION:us-east-1}"
  dynamodb:
    endpoint: "https://dynamodb.us-east-1.amazonaws.com"
  #app:
  #dynamo:
